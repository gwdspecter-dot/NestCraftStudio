name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries (headless / offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libx11-xcb1
      - run: pip install -r requirements-dev.txt
      - run: ruff check core models ui tests
      - name: mypy (non-blocking until cleaned up)
        run: mypy core models
        continue-on-error: true
      # build123d в requirements, но тяжёлые B-Rep тесты помечены slow — здесь их пропускаем
      - run: pytest -m "not slow and not gui"
        env:
          QT_QPA_PLATFORM: offscreen

  # Ревизия 3 §1.7: реальный build123d / OpenCASCADE (маркер slow)
  slow:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        b123d: ["0.9.0", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries (headless / offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libx11-xcb1
      - name: Install base deps + matrix build123d
        run: |
          set -e
          # Runtime без build123d — версию ставим из матрицы.
          grep -v -E '^[[:space:]]*build123d' requirements.txt > /tmp/req-no-b123d.txt
          pip install -r /tmp/req-no-b123d.txt
          pip install "pytest>=7.4.0"

          # Чистый стек OCP под выбранную версию
          pip uninstall -y \
            build123d cadquery-ocp cadquery-ocp-novtk cadquery-ocp-proxy \
            ocpsvg ocp_gordon vtk 2>/dev/null || true

          if [ "${{ matrix.b123d }}" = "latest" ]; then
            pip install -U "build123d"
          else
            # build123d 0.9.0 → cadquery-ocp 7.8 (TColgp_Array1OfPnt).
            # Современный ocpsvg>=0.5 тянет OCP.collections (OCP 8) и ломает импорт:
            #   ModuleNotFoundError: No module named 'OCP.collections'
            # Поэтому для min-версии фиксируем ocpsvg 0.4.x (API OCP 7.x).
            pip install \
              "build123d==${{ matrix.b123d }}" \
              "ocpsvg>=0.4,<0.5"
          fi
          python -c "import build123d; print('build123d', getattr(build123d, '__version__', '?'))"
          python -c "import ocpsvg; print('ocpsvg OK')"
      - name: Verify Extrinsic API (минимальная версия)
        run: |
          python - <<'PY'
          from build123d import Extrinsic, Rotation
          assert hasattr(Extrinsic, "XYZ"), "Extrinsic.XYZ required (min build123d 0.9.0)"
          print("Extrinsic.XYZ OK")
          PY
      - name: Run slow B-Rep tests
        run: pytest -m slow -v --ignore=tests/test_theme.py
        env:
          QT_QPA_PLATFORM: offscreen

  # Ревизия 4 §1.4: реальный probe PID на Windows (без os.kill → TerminateProcess)
  windows-pid:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test deps
        run: |
          python -m pip install -U pip
          pip install pytest
          # project_io тянет models/logging — без PyQt6/build123d достаточно
      - name: PID probe tests (native Windows API)
        run: pytest tests/test_pid_alive_1_1.py tests/test_pid_start_1_3.py -v
        env:
          PYTHONPATH: .
